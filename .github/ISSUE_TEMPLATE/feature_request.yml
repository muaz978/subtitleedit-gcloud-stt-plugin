name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Which part would it change?
      options:
        - Subtitle Edit plugin
        - Standalone tool (transcribe-episode.py)
        - Two language tool (transcribe-broadcast.py)
        - QC scripts (tools/qc)
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request contains no keys, project or bucket names, email addresses, personal paths or private transcript text.
          required: true
