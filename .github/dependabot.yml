version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/src/SubtitleEdit.GoogleCloudStt"
      - "/tests/SubtitleEdit.GoogleCloudStt.Tests"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nuget
    groups:
      avalonia:
        patterns:
          - "Avalonia*"
    ignore:
      # Held on purpose. 5.0.0 changes how resumable uploads are validated and raises the Google
      # authentication libraries for the whole plugin. Adopt it only after a run against a real
      # bucket shows that uploads and sign in still work.
      - dependency-name: "Google.Cloud.Storage.V1"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github_actions
